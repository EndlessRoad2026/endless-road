# Copies the game to the cPanel server every time something is pushed to main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.endlessroad.co.za
#   FTP_USERNAME  an FTP account that only has access to the game's folder
#   FTP_PASSWORD
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check secrets are set
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP secrets are not set yet, so nothing was deployed."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Upload game files
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            **/*-backup.html
